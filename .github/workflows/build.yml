name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Front-end libraries
        run: |
          npm ci --no-audit --no-fund
          npm run vendor

      - name: Build
        run: dotnet build src/Mdv/Mdv.csproj -c Release -nologo

      - name: End-to-end tests
        shell: pwsh
        continue-on-error: true # needs an interactive desktop; informative on hosted runners
        run: powershell -ExecutionPolicy Bypass -File tests/run-tests.ps1 -Configuration Release

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/Mdv/Mdv.csproj -c Release -o out/mdv -nologo
          dotnet publish src/Mdv/Mdv.csproj -c Release -o out/mdv-standalone --self-contained true -nologo
          Compress-Archive -Path out/mdv/* -DestinationPath mdv-win-x64.zip
          Compress-Archive -Path out/mdv-standalone/* -DestinationPath mdv-win-x64-standalone.zip
          Copy-Item scripts/get-mdv.ps1 install.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: mdv-win-x64
          path: |
            mdv-win-x64.zip
            mdv-win-x64-standalone.zip
            install.ps1

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mdv-win-x64.zip
            mdv-win-x64-standalone.zip
            install.ps1
          generate_release_notes: true
