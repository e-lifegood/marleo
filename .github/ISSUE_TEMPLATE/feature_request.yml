name: Feature request
description: An idea to make reading Markdown on Windows better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or slow today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could Marleo help? Screenshots or examples from other tools are welcome.
